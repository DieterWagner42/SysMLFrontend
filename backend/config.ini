[Rhapsody]
; The app always starts on the LOCAL store (build the model offline first). Rhapsody is only
; connected to on demand: "Load Model" (jump straight into editing an existing Rhapsody project)
; or "Export to Rhapsody" (push the current local model into one) — both trigger a connection
; attempt at that point, using the settings below. Leave installDir unset/empty to make Rhapsody
; entirely unavailable (both actions fail with a clear "not configured" message) and run purely
; local, with everything kept in memory and persisted to the XML file under [Local] below.
installDir=C:\Program Files\IBM\Rhapsody\10.0.3
; executable=rhapsody.exe          (default: rhapsody.exe)
; instanceId=...                   (attach to a specific running instance by id)
; projectPath=C:\Models\MyProject.rpyx   (if set, eagerly connects and opens this project at
;                                          startup, switching straight to Rhapsody mode instead of
;                                          starting local-first — falls back to local mode if that
;                                          eager connection fails. .rpyx is the current XML-based
;                                          project format. Leave unset for the normal "local first,
;                                          promote to Rhapsody when ready" workflow.)
; launchArgs=-dev_ed -lang=cpp     (default, verified against this install; passed to rhapsody.exe
;                                    when launching it fresh. Without a -lang=..., Rhapsody shows
;                                    an interactive perspective picker on first launch and never
;                                    becomes automatable, so a fully unattended launch needs this
;                                    set. Matches the "Rhapsody Developer C++" Start Menu shortcut;
;                                    change -lang= if you use a different edition/perspective.)
; startupTimeoutSec=60             (default: 60; a fresh launch (no instance already running) took
;                                    ~10-15s against this install — raise this if yours is slower)

; The Rhapsody project a "Load Model" or "Export to Rhapsody" target path points at must already
; exist — create it yourself in Rhapsody first (File > New Project). There is no Rhapsody API to
; create a blank project from scratch; automating that (via a stripped-down template project) was
; tried and abandoned — deleting a whole sample project's worth of elements via automation
; triggered real instability (Rhapsody itself crashed once during testing). Manual project
; creation is simple, safe, and something Rhapsody users already know how to do.

; The metaclass name used when creating a port via IRPModelElement.addNewAggr(). "Port" is the
; real, listed metaclass (see metaclasses.txt in the Doc directory of your Rhapsody installation)
; — an earlier "FlowPort" default was wrong (not a valid metaclass at all; that's why port
; direction never used to take effect). Verified against a live Rhapsody 10.0.3 instance and
; cross-checked against D:\KI\plugin\ECAD's own working SysML reader/writer, which uses the same
; "Port" + "proxyPort" stereotype + interfaceBlock-typed-contract pattern. See backend/CLAUDE.md
; notes on RhapsodyModelStore for the full port model (ProxyPort, 4 views, nested decomposition).
portMetaType=Port

; The metaclass the hierarchy-level stereotype (System of Systems / System / Subsystem /
; Equipment) is applied to. Architecture elements are always created as Blocks (IRPClass, via
; addClass), so this should normally stay "Class" unless your SysML profile uses a different
; metaclass name for blocks. Also used for the interfaceBlock stereotype applied to port types.
levelMetaType=Class

; The metaclass the port view stereotype (Operational/Functional/Logical/Physical) and the
; "proxyPort" stereotype are applied to. Should normally match portMetaType.
viewMetaType=Port

; Off by default (empty = never called). If set, applied to the project via
; IRPApplication.addProfileToModel every time "Load Model" or "Export to Rhapsody" connects.
; DON'T set this unless you have a specific reason to: this app's port/proxyPort/interfaceBlock/
; view mechanism (RhapsodyModelStore) is deliberately ad-hoc (stamped via addStereotype/
; addNewAggr("Tag",...)) and does NOT need the real SysML profile applied — see backend/CLAUDE.md's
; "Ports" section. Found live: applying the actual profile merges its own read-only Port/Block
; definitions into the project, which then collides with this app's plain addNewAggr("Port", ...)
; port creation — "Can't add aggregate of type Port. Cannot modify read only element (or element
; with read only owner) $OMROOT\Profiles\SysML\SysMLProfile_rpy\SysML.sbs." on the very first port
; created afterward. "SysML" (if you do set it) matches the profile folder name under Rhapsody's
; Share/Profiles directory.
; sysmlProfile=SysML

; Multiplies the frontend's own canvas x/y (React Flow pixel coordinates) when placing/moving a
; node on a Block Definition Diagram or a part on an Internal Block Diagram (see
; addAggregationPart/updateDiagramPositions), so those diagrams roughly mirror the frontend's own
; layout instead of an auto-incrementing grid. 1.0 (no scaling) is the default; the "right" factor
; depends on how spread out a given model's frontend layout is and Rhapsody's own diagram zoom —
; increase it if elements end up bunched too close together on the Rhapsody diagram, decrease it if
; they end up spread too far apart to fit on one screen. This value is read FRESH on every position
; update, not just at startup — the backend already watches this file for changes, so editing this
; line and saving takes effect on the very next drag/move in the frontend, no restart or reconnect
; needed, making it practical to try a few values in quick succession while watching the Rhapsody
; diagram update live.
diagramPositionScale=0.75

[Server]
; port=0 (default: 0 = pick any free port)
port=4567
; staticDir=..\frontend\dist   (default: unset — API only, frontend served separately via `npm run
;                                 dev` on :5173, this machine's normal dev workflow). Set this to a
;                                 built frontend bundle (`npm run build` produces frontend/dist) to
;                                 have THIS backend also serve the frontend directly at :4567 — for
;                                 a machine with no Node/npm at all (only Java is then needed to run
;                                 the whole app). Relative paths are resolved against the working
;                                 directory the backend was started from, same as [Local] statePath.

[Local]
; The app's own "project file" format when working offline — the full model (architecture +
; context + capabilities) is auto-saved here after every change, and loaded back from here on
; startup if the file already exists. This is local mode's equivalent of Rhapsody's "on the fly"
; sync: whichever XML file is current is the live one. Relative paths are resolved against the
; working directory the backend was started from. "New Model" resets this to a fresh empty model;
; explicit Save/Load XML in the UI (POST /api/export, /api/import) can target any other path as a
; separate named snapshot without disturbing the auto-persisted one.
statePath=local-model.xml

[Physical]
; Open, extensible list of physical interface types offered (as a dropdown, replacing the usual
; free-text "Type" field) when adding a port while viewing the Physical architecture view.
; Comma-separated — NOT semicolon-separated, since AppConfig's ini parser treats ';' as an
; inline-comment marker, which would silently truncate a semicolon-separated list at the first
; entry. Editable here directly, or via the app's web config page (gear icon in the header), which
; writes back to this exact line — GET/PUT /api/config/physicalInterfaceTypes.
interfaceTypes=data,electrical,electronical,mechanical,electromagnetic-thermal,electromagnetic-optical,chemical,electromagnetic-rf,thermal
